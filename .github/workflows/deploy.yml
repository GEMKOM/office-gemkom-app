# Deploys the assembled site to GitHub Pages (see web/scripts/assemble.mjs): the
# React SPA's one entry at /index.html, in every known route's folder (a 200 for
# each page) and as /404.html (the fallback for any other path), its assets
# under /app-assets/, and the static files.
#
# REQUIRES: repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
# Until that is switched, the branch deploy (main, repo root, built by Jekyll) keeps
# serving the repo as-is and the deploy job below fails without changing the site.
# After switching, check that the custom domain (CNAME) is still set in that settings
# page: an Actions deploy takes the domain from the settings, not from the CNAME file.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run test:legacy
      - run: npm run build
      - run: npm run assemble
      # The SPA entry every deep link depends on: the fallback and a deep route are the same file.
      - run: |
          test -s ../_site/index.html
          cmp ../_site/index.html ../_site/404.html
          cmp ../_site/index.html ../_site/sales/customers/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
