<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMKOM - Neo Kullanımı</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../components/navbar.css">
    <link rel="stylesheet" href="../../components/header/header.css">
    <link rel="stylesheet" href="../../components/dropdown/dropdown.css">
    <link rel="stylesheet" href="../../components/filters/filters.css">
    <link rel="stylesheet" href="../../components/statistics-cards/statistics-cards.css">
    <link rel="stylesheet" href="../../components/table/table.css">
    <link rel="stylesheet" href="../../components/display-modal/display-modal.css">
    <link rel="stylesheet" href="./neo.css">
    <link rel="icon" type="image/png" href="../../images/gemkom.png">
</head>
<body>
    <!-- Navigation -->
    <div id="navbar-container"></div>

    <!-- Main Content Section -->
    <section class="modules-section py-5">
        <div class="container-fluid">
            <!-- Header Component Placeholder -->
            <div id="header-placeholder"></div>

            <div id="neo-denied" class="alert alert-warning d-none" role="alert">
                <i class="fas fa-lock me-2"></i>
                Neo kullanım analizlerini görüntüleme yetkiniz yok. Soru kayıtları kişisel veri
                içerdiğinden bu sayfa ayrı bir yetkiye bağlıdır.
            </div>

            <div id="neo-content" class="d-none">
                <!-- Filters -->
                <div class="row">
                    <div class="col-12"><div id="filters-placeholder"></div></div>
                </div>

                <!-- Statistics cards -->
                <div id="neo-stats"></div>

                <!-- Breakdown tables -->
                <div class="row g-3 mb-4">
                    <div class="col-12 col-xl-5">
                        <div class="neo-card">
                            <div class="neo-card-title"><i class="fas fa-users me-2"></i>Kullanıcı Bazında</div>
                            <div id="neo-users-table"></div>
                        </div>
                    </div>
                    <div class="col-12 col-xl-4">
                        <div class="neo-card">
                            <div class="neo-card-title"><i class="fas fa-wrench me-2"></i>Konu Dağılımı</div>
                            <div id="neo-tools-table"></div>
                        </div>
                    </div>
                    <div class="col-12 col-xl-3">
                        <div class="neo-card">
                            <div class="neo-card-title"><i class="fas fa-fire me-2"></i>En Çok Sorulan İşler</div>
                            <div id="neo-jobs-table"></div>
                        </div>
                    </div>
                </div>

                <!-- Question log -->
                <div class="neo-card mb-4">
                    <div class="neo-card-title"><i class="fas fa-comments me-2"></i>Soru Kayıtları</div>
                    <div id="neo-questions-table"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Conversation transcript modal mount -->
    <div id="neo-modal-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Page script -->
    <script type="module" src="./neo.js"></script>
</body>
</html>
