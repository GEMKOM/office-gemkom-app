<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMKOM - İmalat Planlama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../components/navbar.css">
    <link rel="stylesheet" href="../../components/header/header.css">
    <link rel="stylesheet" href="../../components/table/table.css">
    <link rel="stylesheet" href="../../components/gantt/gantt.css">
    <link rel="stylesheet" href="../../components/dropdown/dropdown.css">
    <link rel="stylesheet" href="../../components/edit-modal/edit-modal.css">
    <link rel="stylesheet" href="../../components/confirmation-modal/confirmation-modal.css">
    <link rel="stylesheet" href="../../components/notification/notification.css">
    <link rel="stylesheet" href="../../components/badges/badges.css">
    <link rel="stylesheet" href="grid.css">
    <link rel="stylesheet" href="planning.css">
    <link rel="stylesheet" href="pdf.css">
    <link rel="stylesheet" href="capacity.css">
    <link rel="icon" type="image/png" href="../../images/gemkom.png">
</head>
<body>
    <div id="navbar-container"></div>

    <section class="modules-section py-5">
        <div class="container-fluid">
            <div id="header-placeholder"></div>

            <div id="warnings-banner" class="alert alert-danger d-none" role="alert"></div>

            <div class="dashboard-card">
                <div class="card-header planning-toolbar">
                    <!-- Deliberately NOT Bootstrap nav-tabs: navbar.css styles the global
                         .nav-link class with !important white text for the top navbar. -->
                    <div class="planning-tabs" id="resource-tabs"></div>
                    <!-- Sheet-wide actions only. Anything that acts on the
                         grid itself — expand/collapse, column choice — lives on
                         the grid header, next to what it changes. -->
                    <div class="card-actions d-flex align-items-center gap-2 flex-wrap">
                        <div class="form-check form-switch mb-0" title="Tamamlanan, iptal edilen ve beklemedeki iş emirlerini de göster">
                            <input class="form-check-input" type="checkbox" id="show-completed-toggle">
                            <label class="form-check-label small text-muted" for="show-completed-toggle">
                                Tamamlananlar
                            </label>
                        </div>
                        <button class="btn btn-sm btn-outline-primary" id="add-job-btn">
                            <i class="fas fa-plus me-1"></i>İş Ekle
                        </button>
                        <button class="btn btn-sm btn-success" id="save-btn" disabled>
                            <i class="fas fa-save me-1"></i>Kaydet
                        </button>
                        <button class="btn btn-sm btn-outline-secondary" id="pdf-btn"
                                title="Görünen tabloyu ve zaman çizelgesini PDF olarak indir">
                            <i class="fas fa-file-pdf me-1"></i>PDF
                        </button>
                        <!-- Advisory only: the drawer explains and proposes,
                             the sheet stays the place where plans are typed. -->
                        <button class="btn btn-sm btn-outline-secondary" id="capacity-btn"
                                title="Kapasite önerileri — ekip/taşeron yükü, termin riski, önerilen başlangıçlar">
                            <i class="fas fa-gauge-high me-1"></i>Kapasite<span class="cap-btn-badge d-none" id="capacity-btn-badge"></span>
                        </button>
                        <span class="btn-group pg-zoom" id="zoom-buttons" role="group"
                              aria-label="Zaman ölçeği"
                              title="Zaman ölçeği — zaman çizelgesi üzerinde Ctrl + fare tekerleği ile de değiştirebilirsiniz">
                            <button class="btn btn-outline-secondary" data-zoom="day">Gün</button>
                            <button class="btn btn-outline-secondary active" data-zoom="week">Hafta</button>
                            <button class="btn btn-outline-secondary" data-zoom="month">Ay</button>
                        </span>
                        <span class="pg-zoom-wrap" title="Ne görünsün — işin tamamı, ya da yalnızca Kaynaklı İmalat ve altındaki ekip/taşeron atamaları (ekip dağılımını okumak için)">
                            <span>Görünüm</span>
                            <span class="btn-group pg-zoom" id="scope-buttons" role="group" aria-label="Görünüm">
                                <button class="btn btn-outline-secondary active" data-scope="full">Tam</button>
                                <button class="btn btn-outline-secondary" data-scope="welding">Kaynak</button>
                            </span>
                        </span>
                        <span class="pg-zoom-wrap" title="İş emirlerinin sırası — numaraya göre ya da bu kaynaktaki en erken başlangıca göre (en erken üstte)">
                            <span>Sırala</span>
                            <span class="btn-group pg-zoom" id="sort-buttons" role="group" aria-label="Sıralama">
                                <button class="btn btn-outline-secondary active" data-sort="job_no">İş No</button>
                                <button class="btn btn-outline-secondary" data-sort="start">Başlangıç</button>
                            </span>
                        </span>
                    </div>
                </div>
                <!-- Client-side view filters. Everything the board needs is
                     already in memory, so they narrow the sheet on the spot
                     instead of round-tripping. -->
                <div class="planning-filters">
                    <span class="pf-title"><i class="fas fa-filter"></i>Filtre</span>
                    <div class="pf-field">
                        <span class="pf-label">Ara</span>
                        <input type="text" id="filter-text" class="pf-search"
                               placeholder="İş emri, başlık, müşteri…" autocomplete="off">
                    </div>
                    <div class="pf-field">
                        <span class="pf-label">İş Emri</span>
                        <div id="filter-job"></div>
                    </div>
                    <div class="pf-field">
                        <span class="pf-label">Sorumlu</span>
                        <div id="filter-assignee"></div>
                    </div>
                    <button type="button" class="pf-clear d-none" id="filter-clear"
                            title="Filtreleri temizle">
                        <i class="fas fa-times"></i>Temizle
                    </button>
                    <span class="pf-summary" id="filter-summary"></span>
                </div>
                <div class="card-body p-0">
                    <div id="planning-grid" class="pg"></div>
                </div>
                <div class="card-footer py-2">
                    <!-- Two channels at once: the bar is the schedule state, the
                         blue fill inside it is progress. -->
                    <div class="pg-legend">
                        <span class="pg-legend-item"><i class="pg-swatch pg-swatch-on-time"></i>Zamanında</span>
                        <span class="pg-legend-item"><i class="pg-swatch pg-swatch-late"></i>Gecikmiş</span>
                        <span class="pg-legend-item"><i class="pg-swatch pg-swatch-hold"></i>Beklemede</span>
                        <span class="pg-legend-item"><i class="pg-swatch pg-swatch-progress"></i>Tamamlanan kısım</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="block-modal-container"></div>
    <div id="tier-modal-container"></div>
    <div id="custom-stage-modal-container"></div>
    <div id="confirm-modal-container"></div>

    <!-- Kapasite drawer: a body-level offcanvas (never inside the navbar's
         backdrop-filter, which would trap position:fixed). No backdrop and
         body scroll on, so the sheet behind stays editable while reading. -->
    <div class="offcanvas offcanvas-end cap-drawer" id="capacity-drawer" tabindex="-1"
         data-bs-backdrop="false" data-bs-scroll="true" aria-labelledby="cap-drawer-title">
        <div class="offcanvas-header cap-drawer-head">
            <div class="cap-drawer-titles">
                <h5 class="offcanvas-title" id="cap-drawer-title"><i class="fas fa-gauge-high me-2"></i>Kapasite önerileri</h5>
                <span class="cap-stamp" id="cap-drawer-stamp"></span>
            </div>
            <div class="cap-drawer-tools">
                <span class="pg-zoom-wrap" title="Hız ölçümünde kullanılan geçmiş (tam aylar)">
                    <span>Geçmiş</span>
                    <span class="btn-group pg-zoom" id="cap-months" role="group" aria-label="Geçmiş">
                        <button type="button" class="btn btn-outline-secondary" data-cap-months="3">3 ay</button>
                        <button type="button" class="btn btn-outline-secondary active" data-cap-months="6">6 ay</button>
                        <button type="button" class="btn btn-outline-secondary" data-cap-months="12">12 ay</button>
                    </span>
                </span>
                <span class="pg-zoom-wrap" title="Kg'ları işin kg fiyatına göre ağırlıklandır — pahalı iş zor iştir">
                    <span>Zorluk</span>
                    <span class="btn-group pg-zoom" id="cap-difficulty" role="group" aria-label="Zorluk ağırlığı">
                        <button type="button" class="btn btn-outline-secondary active" data-cap-difficulty="1">Açık</button>
                        <button type="button" class="btn btn-outline-secondary" data-cap-difficulty="0">Kapalı</button>
                    </span>
                </span>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="cap-refresh" title="Raporu yeniden hesapla">
                    <i class="fas fa-rotate"></i>
                </button>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Kapat"></button>
            </div>
        </div>
        <div class="offcanvas-body cap-drawer-body" id="cap-drawer-body"></div>
    </div>

    <footer class="footer-section">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>GEMKOM</h5>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="text-light mb-0">&copy; 2024 GEMKOM. Tüm hakları saklıdır.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="planning.js"></script>
</body>
</html>
