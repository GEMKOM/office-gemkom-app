<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMKOM - Kalite Evrakları</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../components/navbar.css">
    <link rel="stylesheet" href="../../components/dropdown/dropdown.css">
    <link rel="icon" type="image/png" href="../../images/gemkom.png">
    <link rel="stylesheet" href="../../components/header/header.css">
    <link rel="stylesheet" href="../../components/table/table.css">
    <link rel="stylesheet" href="../../components/filters/filters.css">
    <link rel="stylesheet" href="../../components/edit-modal/edit-modal.css">
    <link rel="stylesheet" href="../../components/dropdown/dropdown.css">
    <link rel="stylesheet" href="../../components/badges/badges.css">
    <style>
        .expiry-banner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem 1.5rem;
            padding: 0.75rem 1rem;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-left: 4px solid #f97316;
            border-radius: 0.5rem;
        }
        .expiry-banner-icon { color: #f97316; }
        .expiry-banner-link { color: #374151; text-decoration: none; font-size: 0.9rem; }
        .expiry-banner-link:hover { color: #111827; text-decoration: underline; }
        .expiry-banner-link .status-badge { min-width: 0; margin-right: 0.35rem; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <section class="modules-section py-5">
        <div class="container-fluid">
            <div id="header-placeholder"></div>
            <div class="row mb-3">
                <div class="col-12">
                    <div id="filters-placeholder"></div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-12">
                    <div id="expiry-banner" class="expiry-banner d-none" role="status"></div>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div id="documents-table-container"></div>
                </div>
            </div>
        </div>
    </section>

    <div id="document-edit-modal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../components/header/header.js"></script>
    <script type="module" src="../../components/table/table.js"></script>
    <script type="module" src="../../components/filters/filters.js"></script>
    <script type="module" src="../../components/edit-modal/edit-modal.js"></script>
    <script type="module" src="documents.js"></script>
</body>
</html>
