<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMKOM - Referanslar</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../components/navbar.css">
    <link rel="stylesheet" href="../../components/header/header.css">
    <link rel="stylesheet" href="../../components/filters/filters.css">
    <link rel="stylesheet" href="../../components/dropdown/dropdown.css">
    <link rel="stylesheet" href="../../components/table/table.css">
    <link rel="stylesheet" href="../../components/badges/badges.css">
    <link rel="stylesheet" href="../../components/display-modal/display-modal.css">
    <link rel="stylesheet" href="../../components/notification/notification.css">
    <link rel="stylesheet" href="../../components/estimate-report/estimate-report.css">
    <link rel="stylesheet" href="references.css">
    <link rel="icon" type="image/png" href="../../images/gemkom.png">
</head>
<body>
    <!-- Navigation -->
    <div id="navbar-container"></div>

    <!-- Main Content Section -->
    <section class="modules-section py-5">
        <div class="container-fluid">
            <div id="header-placeholder"></div>

            <div class="ref-toolbar">
                <div class="ref-toolbar-text">
                    Kaynak listesi çıkarılmış her iş: kayıtlı saat ÷ standart birim sürelerle hesaplanan saat = <strong>faktör</strong>.
                    Hariç tutulan işler hiçbir tahminde kullanılmaz.
                </div>
                <div class="ref-toolbar-buttons">
                    <button type="button" class="btn btn-sm btn-outline-primary" id="ref-units-btn">
                        <i class="fas fa-sliders me-1"></i>Birim süreler
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="ref-method-btn">
                        <i class="fas fa-circle-question me-1"></i>Nasıl çalışır?
                    </button>
                </div>
            </div>

            <div id="ref-summary" class="ref-summary"></div>

            <div id="ref-units-panel" class="ref-units-panel" hidden></div>

            <div class="row">
                <div class="col-12">
                    <div id="filters-placeholder"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-12 ref-page-table">
                    <div id="references-table-container"></div>
                </div>
            </div>
        </div>
    </section>

    <div id="reference-modal-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="references.js"></script>
</body>
</html>
