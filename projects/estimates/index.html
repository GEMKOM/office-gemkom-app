<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMKOM - Tahminler</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../components/navbar.css">
    <link rel="stylesheet" href="../../components/header/header.css">
    <link rel="stylesheet" href="../../components/statistics-cards/statistics-cards.css">
    <link rel="stylesheet" href="../../components/filters/filters.css">
    <link rel="stylesheet" href="../../components/dropdown/dropdown.css">
    <link rel="stylesheet" href="../../components/table/table.css">
    <link rel="stylesheet" href="../../components/badges/badges.css">
    <link rel="stylesheet" href="../../components/display-modal/display-modal.css">
    <link rel="stylesheet" href="../../components/notification/notification.css">
    <link rel="stylesheet" href="../../components/estimate-report/estimate-report.css">
    <link rel="icon" type="image/png" href="../../images/gemkom.png">
    <style>
        /* ModernDropdown menus portal to body; inside the detail modal they must sit above the dialog. */
        body > .modern-dropdown-portal,
        body > .modern-dropdown-portal .modern-dropdown-menu-portal { z-index: 1080 !important; }
        .est-page-table .table td { vertical-align: middle; }
        .est-page-table .table .status-badge { min-width: 0; }
        .est-page-table .table td.est-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .est-page-table .table tr { cursor: pointer; }
        #estimate-detail-modal-container .modal-body { background: #fbfaff; }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div id="navbar-container"></div>

    <!-- Main Content Section -->
    <section class="modules-section py-5">
        <div class="container-fluid">
            <div id="header-placeholder"></div>

            <div class="row">
                <div class="col-12">
                    <div id="statistics-cards-container"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div id="filters-placeholder"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-12 est-page-table">
                    <div id="estimates-table-container"></div>
                </div>
            </div>
        </div>
    </section>

    <div id="estimate-detail-modal-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="estimates.js"></script>
</body>
</html>
