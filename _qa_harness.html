<!doctype html>
<html><head><meta charset="utf-8"><title>QA harness</title></head>
<body>
<script>
// TEMPORARY (QA session 2026-09-24) — delete after use. Loads a page with its
// API calls rewritten from the user's 8001 server to the QA server on 8002.
(async () => {
    const params = new URLSearchParams(location.search);
    const page = params.get('page');
    const query = params.get('q') || '';
    localStorage.setItem('accessToken', params.get('token'));
    localStorage.setItem('refreshToken', 'x');
    localStorage.setItem('user', JSON.stringify({ id: 1, username: 'onatcalik', first_name: 'Onat', last_name: 'Çalık', is_superuser: true }));
    const rewrite = (u) => (typeof u === 'string' ? u.replace('http://127.0.0.1:8001', 'http://127.0.0.1:8002') : u);
    const originalFetch = window.fetch.bind(window);
    window.fetch = (input, init) => {
        if (typeof input === 'string') input = rewrite(input);
        else if (input instanceof Request && input.url.includes('127.0.0.1:8001')) input = new Request(rewrite(input.url), input);
        return originalFetch(input, init);
    };
    const originalOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url, ...rest) { return originalOpen.call(this, method, rewrite(url), ...rest); };
    window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 0);
    const html = await (await originalFetch(page + 'index.html', { cache: 'reload' })).text();
    history.replaceState({}, '', page + query);
    document.open(); document.write(html); document.close();
})();
</script>
</body></html>
