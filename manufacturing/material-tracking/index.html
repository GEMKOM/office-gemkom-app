<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMKOM - Planlama Kalemleri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="../../../components/navbar.css">
    <link rel="stylesheet" href="../../../components/dropdown/dropdown.css">
    <link rel="icon" type="image/png" href="../../../images/gemkom.png">
    <link rel="stylesheet" href="../../../components/header/header.css">
    <link rel="stylesheet" href="../../../components/table/table.css">
    <link rel="stylesheet" href="../../../components/filters/filters.css">
    <link rel="stylesheet" href="../../../components/badges/badges.css">
    <link rel="stylesheet" href="../../../components/edit-modal/edit-modal.css">
    <link rel="stylesheet" href="../../../components/display-modal/display-modal.css">
    <link rel="stylesheet" href="../../../components/confirmation-modal/confirmation-modal.css">
    <link rel="stylesheet" href="./materialTracking.css">
</head>
<body>
    <div id="navbar-container"></div>

    <section class="modules-section py-5">
        <div class="container-fluid">
            <div id="header-placeholder"></div>

            <div class="row mb-3">
                <div class="col-12">
                    <div id="items-filters-placeholder"></div>
                </div>
            </div>

            <div class="row mb-2">
                <div class="col-12">
                    <div id="pull-request-bulk-actions" class="d-none d-flex align-items-center gap-2">
                        <span id="pull-request-selected-count" class="text-muted"></span>
                        <button type="button" class="btn btn-sm btn-primary" id="pull-request-create-btn">
                            <i class="fas fa-dolly me-1"></i>Depodan Çekme Talebi Oluştur
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="pull-request-clear-selection-btn">
                            Seçimi Temizle
                        </button>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div id="planning-items-table-container"></div>
                </div>
            </div>

        </div>
    </section>

    <!-- Create Pull Request Modal -->
    <div id="pull-request-create-modal-container"></div>

    <!-- Pull Request Detail Modal -->
    <div id="pull-request-detail-modal-container"></div>

    <!-- Cancel Confirmation Modal -->
    <div id="pull-request-cancel-confirmation-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../../../components/header/header.js"></script>
    <script type="module" src="../../../components/table/table.js"></script>
    <script type="module" src="../../../components/filters/filters.js"></script>
    <script type="module" src="./materialTracking.js"></script>
</body>
</html>
