<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMKOM - Kaynak Planlama</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="../../../components/navbar.css">
    <link rel="stylesheet" href="../../../components/header/header.css">
    <link rel="stylesheet" href="../../../components/table/table.css">
    <link rel="stylesheet" href="../../../components/gantt/gantt.css">
    <link rel="stylesheet" href="../../../components/dropdown/dropdown.css">
    <link rel="stylesheet" href="../../../components/edit-modal/edit-modal.css">
    <link rel="stylesheet" href="../../../components/confirmation-modal/confirmation-modal.css">
    <link rel="stylesheet" href="../../../components/notification/notification.css">
    <link rel="stylesheet" href="../../../components/badges/badges.css">
    <link rel="stylesheet" href="planning.css">
    <link rel="icon" type="image/png" href="../../../images/gemkom.png">
</head>
<body>
    <div id="navbar-container"></div>

    <section class="modules-section py-5">
        <div class="container-fluid">
            <div id="header-placeholder"></div>

            <div id="warnings-banner" class="alert alert-danger d-none" role="alert"></div>

            <div class="dashboard-card mb-3">
                <div class="card-header planning-toolbar">
                    <!-- Deliberately NOT Bootstrap nav-tabs: navbar.css styles the global
                         .nav-link class with !important white text for the top navbar. -->
                    <div class="planning-tabs" id="resource-tabs"></div>
                    <div class="card-actions d-flex align-items-center gap-2">
                        <span id="sheet-total-kg" class="text-muted small"></span>
                        <button class="btn btn-sm btn-outline-secondary" id="open-jobs-btn"
                                title="Atanabilir kaynak işleri listesi">
                            <i class="fas fa-list me-1"></i>İşler
                        </button>
                        <button class="btn btn-sm btn-outline-primary" id="add-job-btn">
                            <i class="fas fa-plus me-1"></i>İş Ekle
                        </button>
                        <button class="btn btn-sm btn-success" id="save-btn" disabled>
                            <i class="fas fa-save me-1"></i>Kaydet
                        </button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div id="sheet-container"></div>
                </div>
            </div>

            <div class="dashboard-card">
                <div class="card-header">
                    <h5 class="card-title">
                        <i class="fas fa-chart-gantt me-2 text-primary"></i>
                        Zaman Çizelgesi
                    </h5>
                </div>
                <div class="card-body">
                    <div id="gantt-container"></div>
                </div>
            </div>
        </div>
    </section>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="jobs-offcanvas" aria-labelledby="jobs-offcanvas-label">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="jobs-offcanvas-label">
                <i class="fas fa-list me-2 text-primary"></i>Kaynak İşleri
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Kapat"></button>
        </div>
        <div class="offcanvas-body">
            <input type="text" id="jobs-search" class="form-control form-control-sm mb-2"
                   placeholder="İş no, başlık veya müşteri ara...">
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="show-completed-toggle">
                <label class="form-check-label small text-muted" for="show-completed-toggle">
                    Tamamlanan işleri göster
                </label>
            </div>
            <small class="text-muted d-block mb-2">Bir işi sürükleyip aktif sayfaya bırakın ya da "İş Ekle" kullanın.</small>
            <div id="jobs-list-container" class="welding-jobs-list"></div>
        </div>
    </div>

    <div id="block-modal-container"></div>
    <div id="tier-modal-container"></div>
    <div id="custom-stage-modal-container"></div>
    <div id="confirm-modal-container"></div>

    <footer class="footer-section">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>GEMKOM</h5>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="text-light mb-0">&copy; 2024 GEMKOM. Tüm hakları saklıdır.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="planning.js"></script>
</body>
</html>
