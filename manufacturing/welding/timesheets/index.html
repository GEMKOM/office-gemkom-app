<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMKOM - Puantaj Onayı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="../../../components/navbar.css">
    <link rel="stylesheet" href="../../../components/header/header.css">
    <link rel="stylesheet" href="../../../components/notification/notification.css">
    <link rel="stylesheet" href="../../../components/badges/badges.css">
    <link rel="stylesheet" href="timesheets.css">
    <link rel="icon" type="image/png" href="../../../images/gemkom.png">
</head>
<body>
    <div id="navbar-container"></div>

    <section class="modules-section py-5">
        <div class="container-fluid">
            <div id="header-placeholder"></div>

            <div class="card ts-card mb-3">
                <div class="card-body d-flex flex-wrap align-items-center gap-3">
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-outline-secondary" id="ts-prev" title="Önceki gün"><i class="fas fa-chevron-left"></i></button>
                        <button type="button" class="btn btn-outline-secondary" id="ts-today">Bugün</button>
                        <button type="button" class="btn btn-outline-secondary" id="ts-next" title="Sonraki gün"><i class="fas fa-chevron-right"></i></button>
                    </div>
                    <input type="date" id="ts-date" class="form-control" style="max-width: 190px;">
                    <span id="ts-day-label" class="fw-semibold"></span>
                    <div id="ts-counts" class="d-flex flex-wrap gap-2"></div>
                    <div class="ms-auto d-flex gap-2">
                        <button type="button" class="btn btn-success" id="ts-approve-clean"><i class="fas fa-check-double me-1"></i>Uyarısız girişleri onayla</button>
                        <a href="/manufacturing/welding/time-entries" class="btn btn-outline-secondary"><i class="fas fa-clock me-1"></i>Zaman Kayıtları</a>
                    </div>
                </div>
            </div>

            <div class="card ts-card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-users me-2"></i>Kaynakçılar <span id="ts-count" class="text-muted"></span></span>
                    <div class="d-flex gap-2 align-items-center">
                        <input type="search" id="ts-filter" class="form-control form-control-sm" placeholder="İsim / ekip ara" style="max-width: 220px;">
                        <select id="ts-state-filter" class="form-select form-select-sm" style="max-width: 200px;">
                            <option value="">Tüm durumlar</option>
                            <option value="pending">Kontrol bekliyor</option>
                            <option value="none">Girilmedi</option>
                            <option value="approved">Onaylandı</option>
                            <option value="blank">Çalışmadı</option>
                        </select>
                    </div>
                </div>
                <div class="card-body p-0" id="ts-list">
                    <div class="p-3 text-muted"><i class="fas fa-spinner fa-spin me-2"></i>Yükleniyor...</div>
                </div>
            </div>
        </div>
    </section>

    <datalist id="ts-job-datalist"></datalist>

    <footer class="footer-section">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>GEMKOM</h5>
                </div>
                <div class="col-md-6 text-md-end">
                    <p class="text-light mb-0">&copy; 2024 GEMKOM. Tüm hakları saklıdır.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="timesheets.js"></script>
</body>
</html>
