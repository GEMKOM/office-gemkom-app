<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMKOM - Kapasite Planlayıcı</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../../style.css">
    <link rel="stylesheet" href="../../../../components/navbar.css">
    <link rel="stylesheet" href="../../../../components/header/header.css">
    <link rel="stylesheet" href="../../../../components/filters/filters.css">
    <link rel="stylesheet" href="../../../../components/table/table.css">
    <link rel="icon" type="image/png" href="../../../../images/gemkom.png">
    <link rel="stylesheet" href="../../../../components/gantt/gantt.css">
    <link rel="stylesheet" href="../../../../components/badges/badges.css">
    <style>
        /* Rows without a machine plan slot: muted grey (never yellow) */
        table tbody tr.unplanned-task-row {
            background-color: #f1f3f5 !important;
        }
        table tbody tr.unplanned-task-row:hover {
            background-color: #e9ecef !important;
        }
        /* Computed-dates hint under the card header */
        .plan-hint {
            font-size: 0.8rem;
            color: #6c757d;
            margin: 0 0 0.75rem 0;
        }
        /* Compact chips inside the operations table */
        .status-badge.plan-chip {
            min-width: 0;
            padding: 0.15rem 0.45rem;
            font-size: 0.7rem;
        }
        .plan-flag {
            font-size: 0.72rem;
            line-height: 1.1;
            white-space: nowrap;
        }
        .plan-due-source {
            font-size: 0.72rem;
            white-space: nowrap;
        }
        .plan-lock-btn {
            padding: 0.15rem 0.45rem;
            line-height: 1;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div id="navbar-container"></div>

    <!-- Main Content Section -->
    <section class="modules-section py-5">
        <div class="container-fluid">
            <!-- Header Component Placeholder -->
            <div id="header-placeholder"></div>

            <!-- Filters Section -->
            <div id="filters-placeholder"></div>

            <!-- Capacity Planning Content -->
            <div class="row">
                <!-- Machines Table -->
                <div class="col-lg-2">
                    <div id="machines-table-container"></div>
                </div>

                <!-- Operations and Gantt Chart -->
                <div class="col-lg-10">
                    <div class="dashboard-card">
                        <div class="card-header">
                            <h5 class="card-title">
                                <i class="fas fa-tasks me-2 text-primary"></i>
                                <span id="selected-machine-name">Makine Seçin</span>
                            </h5>
                            <div class="card-actions">
                                <button class="btn btn-sm btn-outline-primary" id="reschedule-btn" title="Tüm makine kuyruklarını sunucuda termine göre yeniden planla">
                                    <i class="fas fa-sync-alt me-1"></i>Yeniden Planla
                                </button>
                                <button class="btn btn-sm btn-primary" id="save-plan-btn" disabled>
                                    <i class="fas fa-save me-1"></i>Planı Kaydet
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <p class="plan-hint">
                                <i class="fas fa-info-circle me-1"></i>Tarihler termine göre otomatik hesaplanır; sırayı sabitlemek için satırı kilitleyin.
                            </p>
                            <!-- Operations Table -->
                            <div class="mb-4">
                                <div id="operations-table-container"></div>
                            </div>

                            <!-- Gantt Chart -->
                            <div id="gantt-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Header Component -->
    <script src="../../../../components/header/header.js"></script>
    <!-- Filters Component -->
    <script src="../../../../components/filters/filters.js"></script>
    <!-- Table Component -->
    <script src="../../../../components/table/table.js"></script>
    <script type="module" src="planning.js"></script>
</body>
</html>
